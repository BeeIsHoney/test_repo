<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Login page UI demo">
  <title>Login | Demo Website</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid #e2e8f0; }
    .container { width: min(100% - 40px, 900px); margin: 0 auto; }
    nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .brand { color: #0f172a; font-weight: 800; font-size: 20px; text-decoration: none; }
    .links { display: flex; align-items: center; gap: 22px; }
    .links a { color: #475569; font-size: 14px; text-decoration: none; }
    .links a:hover, .links a[aria-current] { color: #2563eb; }
    main { width: 100%; flex: 1; display: grid; place-items: center; padding: 52px 20px; }
    .card { width: min(100%, 420px); background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 35px; box-shadow: 0 16px 48px rgba(15, 23, 42, .05); }
    h1 { font-size: 28px; letter-spacing: -.8px; line-height: 1.2; margin: 0 0 9px; }
    .subtitle { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
    input { display: block; width: 100%; border: 1px solid #cbd5e1; border-radius: 9px; background: white; padding: 12px 13px; font: inherit; font-size: 14px; color: #0f172a; }
    input:focus-visible { outline: 3px solid #bfdbfe; border-color: #2563eb; }
    .password-group { position: relative; }
    .password-group input { padding-right: 76px; }
    .toggle { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); cursor: pointer; background: transparent; border: 0; color: #2563eb; font-weight: 650; padding: 8px; font-size: 13px; }
    .submit { width: 100%; border: none; border-radius: 9px; padding: 13px 16px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; background: #2563eb; }
    .submit:hover { background: #1d4ed8; }
    .message { font-size: 13px; color: #047857; min-height: 0; line-height: 1.5; margin: 14px 0 0; }
    .demo { margin: 20px 0 0; border-top: 1px solid #e2e8f0; padding-top: 17px; color: #64748b; font-size: 12px; text-align: center; }
    footer { border-top: 1px solid #e2e8f0; padding: 22px; color: #94a3b8; text-align: center; font-size: 13px; }
    @media (max-width: 480px) { .links { gap: 14px; } .card { padding: 27px 22px; } }
  </style>
</head>
<body>
  <header>
    <nav class="container" aria-label="Main navigation">
      <a class="brand" href="./index.html">Demo Website</a>
      <div class="links">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./login.html" aria-current="page">Login</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">Welcome back</h1>
      <p class="subtitle">Sign in to continue to your account.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-group">
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
            <button type="button" class="toggle" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="submit" type="submit">Sign in</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
      <p class="demo">UI demonstration only · No real authentication or credential submission</p>
    </section>
  </main>
  <footer>Demo Website · Login UI Test</footer>
  <script>
    const password = document.getElementById('password');
    const toggle = document.getElementById('toggle-password');
    toggle.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(show));
    });
    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.getElementById('message').textContent = 'Demo successful! No credentials were sent or saved.';
      password.value = '';
    });
  </script>
</body>
</html>
