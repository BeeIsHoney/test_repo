<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Bee frontend demo login page">
  <title>Login | Bee</title>
  <style>
    :root { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#1e293b; background:#f7f8fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; }
    header { padding:22px 28px; }
    .brand { text-decoration:none; color:#2563eb; font-size:22px; font-weight:800; letter-spacing:-.8px; }
    main { flex:1; display:flex; justify-content:center; align-items:center; padding:24px; }
    .card { width:100%; max-width:420px; background:white; border:1px solid #e5e7eb; border-radius:18px; padding:38px; box-shadow:0 18px 45px rgba(15,23,42,.06); }
    h1 { font-size:28px; line-height:1.2; margin:0 0 8px; letter-spacing:-.8px; }
    p { color:#64748b; font-size:14px; margin:0 0 28px; line-height:1.6; }
    label { display:block; font-size:13px; font-weight:650; margin-bottom:8px; }
    .field { margin-bottom:19px; }
    input { display:block; width:100%; padding:13px 14px; border:1px solid #cbd5e1; border-radius:10px; background:white; color:#0f172a; font:inherit; font-size:14px; outline:none; }
    input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:71px; }
    .toggle { position:absolute; top:50%; right:8px; transform:translateY(-50%); border:0; background:transparent; cursor:pointer; font-size:12px; color:#2563eb; padding:8px; font-weight:700; }
    .submit { margin-top:5px; width:100%; background:#2563eb; border:0; color:white; padding:13px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:700; }
    .submit:hover { background:#1d4ed8; }
    .notice { min-height:24px; font-size:13px; line-height:1.5; color:#475569; margin:16px 0 0; }
    .back { text-align:center; display:block; color:#2563eb; text-decoration:none; font-size:13px; font-weight:650; margin-top:20px; }
    .back:hover { text-decoration:underline; }
    footer { text-align:center; color:#94a3b8; padding:20px; font-size:12px; }
    @media(max-width:480px) { header { padding:18px 22px; } .card { padding:28px 22px; } main { padding:16px; } }
  </style>
</head>
<body>
  <header><a class="brand" href="./index.html">Bee.</a></header>
  <main>
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">Welcome back 👋</h1>
      <p>Sign in to your Bee test account.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="6" required>
            <button class="toggle" id="toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="submit" type="submit">Sign in</button>
        <div class="notice" id="message" role="status" aria-live="polite"></div>
      </form>
      <a class="back" href="./index.html">← Back to home</a>
    </section>
  </main>
  <footer>Bee Test Page · Frontend demo only</footer>
  <script>
    const input = document.getElementById("password");
    const toggle = document.getElementById("toggle");
    toggle.addEventListener("click", () => {
      const isShown = input.type === "password";
      input.type = isShown ? "text" : "password";
      toggle.textContent = isShown ? "Hide" : "Show";
      toggle.setAttribute("aria-label", isShown ? "Hide password" : "Show password");
      toggle.setAttribute("aria-pressed", String(isShown));
    });
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("message").textContent =
        "UI test successful. No login service is connected, and no credentials were sent.";
    });
  </script>
</body>
</html>
