<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fc">
  <title>Bee | Test Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f8fc;
      color: #1e293b;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
    }
    .nav {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { font-size: 20px; font-weight: 800; color: #2563eb; }
    .branch { color: #64748b; font-size: 13px; }
    main {
      max-width: 850px;
      margin: 80px auto;
      padding: 0 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, .05);
      padding: 38px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 11px;
      border-radius: 100px;
      background: #ecfdf5;
      color: #047857;
      font-size: 13px;
      font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.2; margin: 22px 0 10px; }
    p { color: #64748b; line-height: 1.7; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
    button {
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .login-link { display:inline-flex; align-items:center; border-radius:9px; background:#0f172a; color:#fff; padding:12px 18px; font-weight:600; text-decoration:none; }\n    .login-link:hover { background:#334155; }\n    .reset { background: #e2e8f0; color: #334155; }
    .reset:hover { background: #cbd5e1; }
    .counter { color: #0f172a; font-weight: 700; }
    footer { text-align: center; color: #94a3b8; font-size: 13px; padding: 22px; }
    @media (max-width: 600px) { main { margin: 42px auto; } .card { padding: 25px; } }
  </style>
</head>
<body>
  <header>
    <nav class="nav" aria-label="Main navigation">
      <span class="brand">Bee.</span>
      <span class="branch">test_repo / Bee branch</span>
    </nav>
  </header>
  <main>
    <section class="card">
      <span class="status"><span class="dot" aria-hidden="true"></span> Frontend ready</span>
      <h1>Hello, Bee! 👋</h1>
      <p>This is a simple homepage for testing HTML, CSS, JavaScript, and GitHub branch updates.</p>
      <p>Button clicks: <span class="counter" id="count" aria-live="polite">0</span></p>
      <div class="actions">
        <a class="login-link" href="./login.html">Open Login Page</a>\n        <button id="test" type="button">Test Button</button>
        <button id="reset" class="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <footer>Bee Test Page · Simple and responsive</footer>
  <script>
    let count = 0;
    const counter = document.getElementById("count");
    document.getElementById("test").addEventListener("click", () => {
      count += 1;
      counter.textContent = String(count);
    });
    document.getElementById("reset").addEventListener("click", () => {
      count = 0;
      counter.textContent = "0";
    });
  </script>
</body>
</html>
